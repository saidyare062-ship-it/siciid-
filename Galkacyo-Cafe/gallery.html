<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery | Galkayo Café</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <!-- ========== HEADER + NAV (the same on all 5 pages) ========== -->
    <header class="site-header">
        <div class="container">
            <a href="index.html" class="logo">☕ Galkayo Café</a>
            <nav>
                <a href="index.html">Home</a>
                <a href="menu.html">Menu</a>
                <a href="gallery.html" class="active">Gallery</a>
                <a href="about.html">About</a>
                <a href="contact.html">Contact</a>
            </nav>
        </div>
    </header>

    <!-- ========== PAGE CONTENT (different on each page) ========== -->
    <main class="container">
        <div class="page-head">
            <h1>Gallery</h1>
            <p class="lead">A look inside Galkayo Café.</p>
        </div>

        <div class="grid gallery">
            <figure>
                <img src="assets/images/coffee.svg" alt="Fresh coffee">
                <figcaption>Fresh coffee</figcaption>
            </figure>
            <figure>
                <img src="assets/images/shaah.svg" alt="Somali tea">
                <figcaption>Somali tea</figcaption>
            </figure>
            <figure>
                <img src="assets/images/sambuusa.svg" alt="Hot sambuusa">
                <figcaption>Hot sambuusa</figcaption>
            </figure>
            <figure>
                <img src="assets/images/mango.svg" alt="Mango juice">
                <figcaption>Mango juice</figcaption>
            </figure>
            <figure>
                <img src="assets/images/cake.svg" alt="Chocolate cake">
                <figcaption>Chocolate cake</figcaption>
            </figure>
            <figure>
                <img src="assets/images/cafe.svg" alt="Our café">
                <figcaption>Our café</figcaption>
            </figure>
        </div>
    </main>

    <!-- ========== FOOTER (the same on all 5 pages) ========== -->
    <footer class="site-footer">
        <div class="container">
            <p class="footer-name">☕ Galkayo Café</p>
            <p>Main Road, Galkayo, Somalia · +252 90 000 0000</p>
            <p class="copy">&copy; 2025 Galkayo Café. All rights reserved.</p>
        </div>
    </footer>
</body>
</html>
